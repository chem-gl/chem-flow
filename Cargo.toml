[package]
name = "chemflow-rust"
version = "0.1.0"
edition.workspace = true
[workspace.package]
edition = "2021"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
rayon = "1.5"
dashmap = "6.1"
indexmap = "2.11"
dotenvy = "0.15"
once_cell = "1.19"
sha2 = "0.10"
chem-domain = { path = "crates/chem-domain" }
flow = { path = "crates/flow" }
chem-persistence = { path = "crates/chem-persistence" }
chem-providers = { path = "crates/chem-providers" }
chem-workflow = { path = "crates/chem-workflow" }
chem-utils = { path = "crates/chem-utils" }
postgres = "0.19"
[dev-dependencies]
tokio-test = "0.4"
cargo-tarpaulin = "0.32"
grcov = "0.10"
[[bin]]
name = "main-core"
path = "src/main.rs"
[workspace]
members = [
  "crates/chem-domain",
  "crates/flow",
  "crates/chem-persistence",
  "crates/chem-providers",
  "crates/chem-workflow",
  "crates/chem-utils"
]
[patch.crates-io]
pyo3 = { git = "https://github.com/PyO3/pyo3", tag = "v0.26.0" }
[[example]]
name = "example-domain"
required-features = ["integration_examples"]
[features]
# Por defecto no activamos Postgres para que los tests usen SQLite o in-memory
default = []
# Habilita el ejemplo/demostración con Postgres (producción/examples)
pg_demo = ["chem-persistence/pg"]
# Selección explícita de backends de persistencia
# - Tests: habilitar `sqlite`
# - Producción/examples: habilitar `postgres` o `pg_demo`
sqlite = ["chem-persistence/sqlite"]
postgres = ["chem-persistence/postgres"]
# Feature para ejecutar tests con mocks (sin RDKit real)
mock_rdkit = ["chem-domain/mock_rdkit", "chem-providers/mock_rdkit", "chem-persistence/mock_rdkit", "chem-workflow/mock_rdkit", "chem-utils/mock_rdkit"]
# Feature para utilidades de testing (activa SQLite en chem-persistence)
testing = ["chem-persistence/testing", "chem-utils/testing"]
# Feature para ejemplos de integración (Phase 4)
integration_examples = []
