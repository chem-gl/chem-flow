[package]
name = "flow"
version = "0.1.0"
edition = "2021"
[features]
default = []
testing = []
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
blake3 = "1"
thiserror = "2.0"
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
[dev-dependencies]
mockall = "0.11"
tempfile = "3.10"
tokio = { version = "1", features = ["macros", "rt"] }
