[package]
name = "chem-persistence"
version = "0.1.0"
edition = "2021"
[features]
default = ["sqlite"]
postgres = ["diesel/postgres", "diesel_migrations/postgres"]
sqlite = ["diesel/sqlite", "diesel_migrations/sqlite"]
pg = ["postgres"]
no-artifact-insert = []
testing = ["sqlite", "tempfile"]
mock_rdkit = ["chem-domain/mock_rdkit"]
integration_tests_disabled = []
[dependencies]
flow = { path = "../flow" }
chem-domain = { path = "../chem-domain" }
diesel = { version = "2.3.1", default-features = false, features = ["r2d2", "chrono", "serde_json", "uuid"] }
diesel_migrations = { version = "2.1.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
dotenvy = "0.15"
r2d2 = "0.8"
once_cell = "1.19"
log = "0.4"
tempfile = { version = "3.10", optional = true }
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
[dev-dependencies]
serde_json = "1.0"
[[example]]
name = "persistence_simple_usage"
required-features = ["postgres"]
