[package]
name = "chem-domain"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Feature mock_rdkit ahora es solo un marcador (para compatibilidad durante refactor)
# Ya no se propaga a chem-providers
mock_rdkit = []
testing = ["mock_rdkit"]
integration_tests_disabled = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
# ✅ Eliminada dependencia de chem-providers (dominio puro)
 
[dev-dependencies]
mockall = "0.11"
tempfile = "3.10"
