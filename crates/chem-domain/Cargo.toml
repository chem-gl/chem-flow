[package]
name = "chem-domain"
version = "0.1.0"
edition = "2021"

[features]
default = []
mock_rdkit = ["chem-providers/mock_rdkit"]
testing = ["mock_rdkit"]

[dependencies]
 serde = { version = "1.0", features = ["derive"] }
 serde_json = "1.0"
 uuid = { version = "1.0", features = ["v4", "serde"] }
 sha2 = "0.10"
 once_cell = "1.17"
 thiserror = "2.0"
 chrono = { version = "0.4", features = ["serde"] }
 chem-providers = { path = "../chem-providers" }
 
[dev-dependencies]
 mockall = "0.11"
 tempfile = "3.10"
