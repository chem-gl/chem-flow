[package]
name = "chem-domain"
version = "0.1.0"
edition = "2021"
[features]
default = ["async"]
async = ["tokio"]
mock_rdkit = []
testing = ["mock_rdkit"]
integration_tests_disabled = []
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
async-trait = "0.1"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"], optional = true }
[dev-dependencies]
mockall = "0.13"
tempfile = "3.10"
tokio-test = "0.4"
